name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      # fetch-depth 0: MinVer derives the version from the nearest tag and needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      # --project is required, not a stylistic choice: this repo runs on Microsoft.Testing.Platform
      # (see global.json "test.runner"), which rejects the VSTest-style invocation and its flags.
      # Do not "fix" this into `dotnet test tests/...` or add --nologo.
      - run: dotnet test --project tests/VisualBasicFormatter.Tests -c Release

  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - run: dotnet tool restore

      # The formatter's own C#, held to its own csharpier config (.csharpierrc).
      - run: dotnet csharpier check .

  pack:
    name: pack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - run: dotnet pack -c Release -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: artifacts/*.*nupkg
          if-no-files-found: error
